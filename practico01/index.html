<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taildwind pruebas</title>

    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
  </head>

  <body>
    <div id="app" class="mt-5">
      <section class="flex flex-col gap-5">
        <h1 class="text-3xl font-bold text-center">Trabajo practico 1</h1>
        <p class="text-md pl-2.5">
          Hola, mi nombre es <span class="font-bold">{{ nombre }}</span>, tengo
          <span class="font-bold">{{ edad }}</span> años y vivo en
          <span class="font-bold">{{ ciudad }}</span>
        </p>
      </section>
    </div>

    <script>
      Vue.config.devtools = true;

      var app = new Vue({
        el: '#app',

        data: {
          nombre: 'Ana Garcia',
          edad: 30,
          ciudad: 'Tupungato',
        },

        methods: {},

        computed: {},
        mounted() {
          console.log('mounted');
        },
      });
    </script>
  </body>
</html>
