<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taildwind pruebas</title>

    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
  </head>

  <body>
    <div id="app" class="mt-5">
      <h1 class="text-3xl font-bold text-center">Trabajo practico 1</h1>
      <section class="flex flex-col gap-5 bg-amber-100 p-4 rounded-lg shadow-lg w-80 mx-auto mt-5">
        <h2 class="text-2xl font-bold text-center">Ejersicio 1</h2>
        <p class="text-md pl-2.5">
          Hola, mi nombre es <span class="font-bold">{{ nombre }}</span>, tengo
          <span class="font-bold">{{ edad }}</span> años y vivo en
          <span class="font-bold">{{ ciudad }}</span>
        </p>
      </section>
      <section class="flex flex-col gap-5 bg-amber-100 p-4 rounded-lg shadow-lg w-80 mx-auto mt-5">
        <h2 class="text-2xl font-bold text-center">Ejersicio 2</h2>
        <p class="text-md pl-2.5">Contador: <span class="font-bold">{{ contador }}</span></p>
        <div class="flex justify-center gap-3">
          <button
            @click="incrementarContador"
            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded"
          >
            Incrementar
          </button>
          <button
            @click="decrementarContador"
            class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded"
          >
            Decrementar
          </button>
        </div>
      </section>
    </div>

    <script>
      Vue.config.devtools = true;

      var app = new Vue({
        el: '#app',

        data: {
          nombre: 'Ana Garcia',
          edad: 30,
          ciudad: 'Tupungato',
          contador: 0,
        },

        methods: {
          incrementarContador() {
            this.contador++;
          },
          decrementarContador() {
            if (this.contador > 0) {
              this.contador--;
            }
          },
        },

        computed: {},
        mounted() {
          console.log('mounted');
        },
      });
    </script>
  </body>
</html>
